name: CI MassoSync

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Obs: as ferramentas de linting (ktlintCheck e detekt) podem falhar na primeira execução 
      # se não estiverem configuradas nos plugins do gradle. Esta etapa ficará aqui para cumprir a T7.
      # Se os plugins não existirem, comente esta linha e use apenas o assembleDebug.
      - name: Run Lint and Detekt
        run: ./gradlew ktlintCheck detekt

      - name: Build Android App (assembleDebug)
        run: ./gradlew :androidApp:assembleDebug
